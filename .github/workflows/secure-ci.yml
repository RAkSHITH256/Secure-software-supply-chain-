name: Secure CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. SECRET SCANNING
  # ============================================================
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. STATIC APPLICATION SECURITY TESTING
  # ============================================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto


  # ============================================================
  # 3. DEPENDENCY SCANNING
  # ============================================================
  dependency-scan:
    name: Dependency Scan - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r app/requirements.txt


  # ============================================================
  # 4. DOCKER IMAGE BUILD
  # ============================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t secure-supply-chain-demo:${{ github.sha }} \
            .


  # ============================================================
  # 5. TRIVY CONTAINER SECURITY SCAN
  # ============================================================
  trivy-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t secure-supply-chain-demo:${{ github.sha }} \
            .

      - name: Create security report directory
        run: |
          mkdir -p security/reports

      # ----------------------------------------------------------
      # JSON REPORT
      # ----------------------------------------------------------
      - name: Run Trivy - JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: json
          output: security/reports/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"

      # ----------------------------------------------------------
      # SARIF REPORT
      # ----------------------------------------------------------
      - name: Run Trivy - SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: sarif
          output: security/reports/trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"

      # ----------------------------------------------------------
      # DOWNLOAD HTML TEMPLATE
      # ----------------------------------------------------------
      - name: Download Trivy HTML template
        run: |
          curl -L \
            -o html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      # ----------------------------------------------------------
      # HTML REPORT
      # ----------------------------------------------------------
      - name: Run Trivy - HTML report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: template
          template: "@html.tpl"
          output: security/reports/trivy-image.html
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: "0"

      # ----------------------------------------------------------
      # SECURITY GATE
      # ----------------------------------------------------------
      - name: Trivy security gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ----------------------------------------------------------
      # UPLOAD REPORTS
      # ----------------------------------------------------------
      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: security/reports/
          retention-days: 30


  # ============================================================
  # 6. SOFTWARE BILL OF MATERIALS
  # ============================================================
  sbom:
    name: SBOM - Syft
    runs-on: ubuntu-latest

    needs:
      - trivy-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t secure-supply-chain-demo:${{ github.sha }} \
            .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: secure-supply-chain-demo:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30