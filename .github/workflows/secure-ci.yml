name: Secure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
  dependency-scan:
    name: Dependency Scan - Pip Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pip-audit --upgrade pip
          pip install -r app/requirements.txt 

      - name: Run Pip Audit
        run: pip-audit -r app/requirements.txt
  docker-build:
    name: build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  
      
      - name: build Docker Image 
        run: |
          docker build \
            -t secure-supply-chain-demo:${{ github.sha }} \
            .
  trivy-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t secure-supply-chain-demo:${{ github.sha }} \
            .

      - name: Create security report directory
        run: |
          mkdir -p security/reports

      - name: Run Trivy - JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: json
          output: security/reports/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: '0'

      - name: Run Trivy - SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: sarif
          output: security/reports/trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: '0'

      - name: Download Trivy HTML template
        run: |
          curl -L \
            -o html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      - name: Run Trivy - HTML report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: template
          template: '@html.tpl'
          output: security/reports/trivy-image.html
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy security gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-supply-chain-demo:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: security/reports/
          retention-days: 30