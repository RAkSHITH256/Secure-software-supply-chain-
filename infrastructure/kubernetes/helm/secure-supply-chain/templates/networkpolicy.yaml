apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secure-supply-chain.fullname" . }}
  labels:
    {{- include "secure-supply-chain.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "secure-supply-chain.selectorLabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}

  egress:
    - {}